<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--mono-100); }
  body { padding: 36px 24px; box-sizing: border-box; display: flex; gap: 24px; align-items: center; justify-content: space-around; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card { width: 96px; height: 64px; background: var(--mono-0); border-radius: 8px; }
  .name { font-size: 11px; font-weight: 500; color: var(--content-primary); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--content-tertiary); }
</style>
</head>
<body>
  <div class="col"><div class="card" style="box-shadow: var(--shadow-100)"></div><div class="name">shadow-100</div><div class="label">cards</div></div>
  <div class="col"><div class="card" style="box-shadow: var(--shadow-200)"></div><div class="name">shadow-200</div><div class="label">popovers</div></div>
  <div class="col"><div class="card" style="box-shadow: var(--shadow-300)"></div><div class="name">shadow-300</div><div class="label">modals</div></div>
  <div class="col"><div class="card" style="box-shadow: var(--shadow-400)"></div><div class="name">shadow-400</div><div class="label">dialogs</div></div>
</body>
</html>
