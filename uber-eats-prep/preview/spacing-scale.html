<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--mono-0); display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .name { width: 100px; font: 500 12px var(--font-mono); color: var(--content-primary); }
  .val { width: 60px; font: 400 11px var(--font-mono); color: var(--content-tertiary); }
  .bar { height: 14px; background: #000; }
</style>
</head>
<body>
  <div class="row"><div class="name">scale-100</div><div class="val">4px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="name">scale-200</div><div class="val">8px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="name">scale-300</div><div class="val">12px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="name">scale-400</div><div class="val">16px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="name">scale-500</div><div class="val">20px</div><div class="bar" style="width:20px"></div></div>
  <div class="row"><div class="name">scale-550</div><div class="val">24px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="name">scale-600</div><div class="val">32px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="name">scale-700</div><div class="val">40px</div><div class="bar" style="width:40px"></div></div>
  <div class="row"><div class="name">scale-800</div><div class="val">48px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="name">scale-900</div><div class="val">64px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="name">scale-1000</div><div class="val">80px</div><div class="bar" style="width:80px"></div></div>
  <div class="row"><div class="name">scale-1200</div><div class="val">96px</div><div class="bar" style="width:96px"></div></div>
</body>
</html>
