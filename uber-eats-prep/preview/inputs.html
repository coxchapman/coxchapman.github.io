<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inputs</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--mono-0); display: flex; flex-direction: column; gap: 14px; max-width: 480px; }
  .field { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 8px; }
  .icon { width: 8px; height: 8px; }
  .filled { background: #EEEEEE; }
  .outline { background: #FFF; border: 1px solid #E2E2E2; }
  .focused { background: #FFF; border: 2px solid #000; padding: 13px 15px; }
  .placeholder { font: 400 16px var(--font-text); color: #757575; }
  .value { font: 400 16px var(--font-text); color: #000; }
  .pin-from { width: 10px; height: 10px; border-radius: 50%; background: #000; }
  .pin-to { width: 10px; height: 10px; background: #000; }
</style>
</head>
<body>
  <div class="field filled"><div class="pin-from"></div><span class="placeholder">Where to?</span></div>
  <div class="field outline"><div class="pin-to"></div><span class="value">123 Mission St, San Francisco</span></div>
  <div class="field focused"><div class="pin-to"></div><span class="value">123 Mission St, San Francisco</span><span style="margin-left:auto;width:14px;height:14px;background:#000;border-radius:50%;"></span></div>
  <div class="field filled" style="padding-left:14px;"><span style="font:500 16px var(--font-text);color:#000">Promo code</span><span style="margin-left:auto;font:500 14px var(--font-text);color:#276EF1">Apply</span></div>
</body>
</html>
