<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Colors — Semantic</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--mono-0); display: flex; flex-direction: column; gap: 16px; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .glabel { font: 500 11px var(--font-text); color: var(--content-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-200); border: 1px solid rgba(0,0,0,0.06); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; }
  .name { font: 500 12px var(--font-text); color: var(--content-primary); }
  .hex { font: 400 11px var(--font-mono); color: var(--content-tertiary); }
  .chip .nm { font: 500 11px var(--font-text); }
</style>
</head>
<body>
  <div class="group">
    <div class="glabel">Positive · Warning · Negative</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:#06C167"><span class="nm" style="color:#fff">Uber Green</span></div><div class="name">uber-green</div><div class="hex">#06C167</div></div>
      <div class="sw"><div class="chip" style="background:#05A357"><span class="nm" style="color:#fff">positive</span></div><div class="name">positive-400</div><div class="hex">#05A357</div></div>
      <div class="sw"><div class="chip" style="background:#FFC043"><span class="nm" style="color:#000">warning</span></div><div class="name">warning-400</div><div class="hex">#FFC043</div></div>
      <div class="sw"><div class="chip" style="background:#E11900"><span class="nm" style="color:#fff">negative</span></div><div class="name">negative-400</div><div class="hex">#E11900</div></div>
      <div class="sw"><div class="chip" style="background:#276EF1"><span class="nm" style="color:#fff">accent</span></div><div class="name">accent-400</div><div class="hex">#276EF1</div></div>
    </div>
  </div>
</body>
</html>
