<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--background-primary); height: 100%; }
  body { display: flex; align-items: center; justify-content: flex-start; padding: 28px; gap: 24px; box-sizing: border-box; }
  .mark { background: #000; color: #FFF; width: 88px; height: 88px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 64px; letter-spacing: -0.06em; line-height: 1; }
  .wordmark { font-family: var(--font-display); font-weight: 800; font-size: 96px; letter-spacing: -0.05em; line-height: 1; color: #000; }
  .meta { display: flex; flex-direction: column; gap: 4px; margin-left: 16px; }
  .meta .label { font-size: 12px; color: var(--content-tertiary); text-transform: uppercase; letter-spacing: 0.08em; }
  .meta .name { font-size: 16px; font-weight: 500; color: var(--content-primary); }
</style>
</head>
<body>
  <div class="mark">U</div>
  <div class="wordmark">Uber</div>
  <div class="meta">
    <div class="label">Wordmark · 2018</div>
    <div class="name">Set in Uber Move Bold</div>
    <div class="name" style="color: var(--content-tertiary); font-weight: 400">Letter-spacing: –0.05em</div>
  </div>
</body>
</html>
