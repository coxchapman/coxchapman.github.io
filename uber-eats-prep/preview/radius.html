<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radius</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--mono-0); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 92px; height: 64px; background: var(--mono-1000); }
  .nm { font: 500 12px var(--font-text); }
  .v { font: 400 11px var(--font-mono); color: var(--content-tertiary); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="nm">radius-100</div><div class="v">4px</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="nm">radius-200</div><div class="v">8px</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="nm">radius-300</div><div class="v">12px</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="nm">radius-400</div><div class="v">16px</div></div>
    <div class="item"><div class="box" style="border-radius:9999px"></div><div class="nm">radius-pill</div><div class="v">9999px</div></div>
  </div>
</body>
</html>
