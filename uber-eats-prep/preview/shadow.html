<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadow / Elevation</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px 24px; background: var(--mono-100); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .box { width: 110px; height: 72px; background: var(--mono-0); border-radius: 12px; }
  .b1 { box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .b2 { box-shadow: 0 2px 8px rgba(0,0,0,0.10); }
  .b3 { box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
  .b4 { box-shadow: 0 16px 48px rgba(0,0,0,0.16); }
  .nm { font: 500 12px var(--font-text); }
  .v { font: 400 11px var(--font-mono); color: var(--content-tertiary); text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box b1"></div><div class="nm">shadow-100</div><div class="v">resting cards</div></div>
    <div class="item"><div class="box b2"></div><div class="nm">shadow-200</div><div class="v">popovers</div></div>
    <div class="item"><div class="box b3"></div><div class="nm">shadow-300</div><div class="v">modals / sheets</div></div>
    <div class="item"><div class="box b4"></div><div class="nm">shadow-400</div><div class="v">feature dialogs</div></div>
  </div>
</body>
</html>
