<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--background-primary); }
  body { padding: 20px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .group { display: flex; flex-direction: column; gap: 0; }
  .title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--content-secondary); margin-bottom: 8px; }
  .row { display: flex; gap: 0; }
  .swatch { flex: 1; height: 56px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; }
  .swatch .name { font-family: var(--font-text); font-size: 10px; font-weight: 500; line-height: 1.2; }
  .dark { color: #fff; }
  .light { color: #000; }
</style>
</head>
<body>
  <div class="group">
    <div class="title">Accent · Uber Blue</div>
    <div class="row">
      <div class="swatch light" style="background: var(--accent-50)"><div class="name">50</div></div>
      <div class="swatch light" style="background: var(--accent-100)"><div class="name">100</div></div>
      <div class="swatch light" style="background: var(--accent-200)"><div class="name">200</div></div>
      <div class="swatch dark" style="background: var(--accent-300)"><div class="name">300</div></div>
      <div class="swatch dark" style="background: var(--accent-400)"><div class="name">400</div></div>
      <div class="swatch dark" style="background: var(--accent-500)"><div class="name">500</div></div>
      <div class="swatch dark" style="background: var(--accent-600)"><div class="name">600</div></div>
      <div class="swatch dark" style="background: var(--accent-700)"><div class="name">700</div></div>
    </div>
  </div>
  <div class="group">
    <div class="title">Positive · Uber Green</div>
    <div class="row">
      <div class="swatch light" style="background: var(--positive-50)"><div class="name">50</div></div>
      <div class="swatch light" style="background: var(--positive-100)"><div class="name">100</div></div>
      <div class="swatch light" style="background: var(--positive-200)"><div class="name">200</div></div>
      <div class="swatch dark" style="background: var(--positive-300)"><div class="name">300</div></div>
      <div class="swatch dark" style="background: var(--positive-400)"><div class="name">400</div></div>
      <div class="swatch dark" style="background: var(--positive-500)"><div class="name">500</div></div>
      <div class="swatch dark" style="background: var(--positive-600)"><div class="name">600</div></div>
      <div class="swatch dark" style="background: var(--positive-700)"><div class="name">700</div></div>
    </div>
  </div>
  <div class="group">
    <div class="title">Warning · Yellow</div>
    <div class="row">
      <div class="swatch light" style="background: var(--warning-50)"><div class="name">50</div></div>
      <div class="swatch light" style="background: var(--warning-100)"><div class="name">100</div></div>
      <div class="swatch light" style="background: var(--warning-200)"><div class="name">200</div></div>
      <div class="swatch light" style="background: var(--warning-300)"><div class="name">300</div></div>
      <div class="swatch light" style="background: var(--warning-400)"><div class="name">400</div></div>
      <div class="swatch dark" style="background: var(--warning-500)"><div class="name">500</div></div>
      <div class="swatch dark" style="background: var(--warning-600)"><div class="name">600</div></div>
      <div class="swatch dark" style="background: var(--warning-700)"><div class="name">700</div></div>
    </div>
  </div>
  <div class="group">
    <div class="title">Negative · Red</div>
    <div class="row">
      <div class="swatch light" style="background: var(--negative-50)"><div class="name">50</div></div>
      <div class="swatch light" style="background: var(--negative-100)"><div class="name">100</div></div>
      <div class="swatch light" style="background: var(--negative-200)"><div class="name">200</div></div>
      <div class="swatch dark" style="background: var(--negative-300)"><div class="name">300</div></div>
      <div class="swatch dark" style="background: var(--negative-400)"><div class="name">400</div></div>
      <div class="swatch dark" style="background: var(--negative-500)"><div class="name">500</div></div>
      <div class="swatch dark" style="background: var(--negative-600)"><div class="name">600</div></div>
      <div class="swatch dark" style="background: var(--negative-700)"><div class="name">700</div></div>
    </div>
  </div>
</body>
</html>
