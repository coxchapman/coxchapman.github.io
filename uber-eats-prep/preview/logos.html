<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logos</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; background: var(--mono-0); display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: stretch; height: 200px; }
  .cell { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .light { background: #FFF; }
  .dark { background: #000; }
  .green { background: #06C167; }
  img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
  <div class="cell light"><img src="../assets/uber-wordmark.svg" style="height:60px;color:#000"></div>
  <div class="cell dark"><img src="../assets/uber-wordmark.svg" style="height:60px;filter:invert(1)"></div>
  <div class="cell light"><img src="../assets/uber-eats-wordmark.svg" style="height:50px"></div>
</body>
</html>
