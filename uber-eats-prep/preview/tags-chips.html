<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--background-primary); }
  body { padding: 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .tag { font-family: var(--font-text); font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2; }
  .neutral { background: var(--mono-100); color: var(--mono-1000); }
  .accent { background: var(--accent-50); color: var(--accent-500); }
  .positive { background: var(--positive-50); color: var(--positive-500); }
  .warning { background: var(--warning-100); color: var(--warning-600); }
  .negative { background: var(--negative-50); color: var(--negative-500); }
  .solid-black { background: #000; color: #fff; }
  .outline { background: #fff; color: var(--mono-1000); border: 1px solid var(--mono-300); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
  <span class="tag neutral">Schedule</span>
  <span class="tag accent">UberX</span>
  <span class="tag positive"><span class="dot"></span>On time</span>
  <span class="tag warning">Surge 1.4x</span>
  <span class="tag negative">Cancelled</span>
  <span class="tag solid-black">Comfort</span>
  <span class="tag outline">Pet friendly</span>
  <span class="tag neutral">$12.50</span>
  <span class="tag neutral">4 min</span>
  <span class="tag accent">New</span>
</body>
</html>
