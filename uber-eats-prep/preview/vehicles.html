<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vehicle marks</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--mono-0); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; border: 1px solid #EEE; border-radius: 12px; }
  .img { width: 96px; height: 64px; }
  .nm { font: 700 16px var(--font-text); }
  .meta { font: 400 12px var(--font-text); color: var(--content-tertiary); }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><img class="img" src="../assets/vehicle-uberx.svg"><div class="nm">UberX</div><div class="meta">4 seats · affordable</div></div>
    <div class="cell"><img class="img" src="../assets/vehicle-uberblack.svg"><div class="nm">Uber Black</div><div class="meta">4 seats · premium sedan</div></div>
    <div class="cell"><img class="img" src="../assets/vehicle-suv.svg"><div class="nm">Uber SUV</div><div class="meta">6 seats · extra space</div></div>
  </div>
</body>
</html>
