<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buttons</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--mono-0); display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .lbl { width: 84px; font: 500 11px var(--font-mono); color: var(--content-tertiary); }
  button { font: 500 16px/1 var(--font-text); border: none; cursor: pointer; padding: 14px 22px; border-radius: 8px; transition: opacity 120ms, background 120ms; }
  button:hover { opacity: 0.88; }
  .primary { background: #000; color: #FFF; }
  .secondary { background: #EEEEEE; color: #000; }
  .tertiary { background: transparent; color: #000; padding: 14px 12px; }
  .destructive { background: #E11900; color: #FFF; }
  .ghost { background: transparent; border: 1px solid #E2E2E2; color: #000; }
  .green { background: #06C167; color: #FFF; }
  .small { padding: 8px 14px; font-size: 14px; border-radius: 6px; }
  .pill { border-radius: 9999px; padding: 10px 18px; font-size: 14px; }
</style>
</head>
<body>
  <div class="row"><div class="lbl">primary</div>
    <button class="primary">Confirm pickup</button>
    <button class="green">Place order · $24.50</button>
    <button class="destructive">Cancel trip</button>
  </div>
  <div class="row"><div class="lbl">secondary</div>
    <button class="secondary">Add a stop</button>
    <button class="ghost">Schedule for later</button>
    <button class="tertiary">Skip</button>
  </div>
  <div class="row"><div class="lbl">sizes</div>
    <button class="primary small">Apply</button>
    <button class="secondary pill">Filters</button>
    <button class="secondary pill">$ Under $15</button>
    <button class="secondary pill">★ 4.5+</button>
  </div>
</body>
</html>
