<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iconography</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--mono-0); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 18px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .nm { font: 500 11px var(--font-mono); color: var(--content-tertiary); }
  .lucide { stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; color: #000; }
  .note { font: 400 11px var(--font-text); color: var(--content-tertiary); margin-top: 16px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><i data-lucide="search" width="28" height="28"></i><div class="nm">search</div></div>
    <div class="cell"><i data-lucide="map-pin" width="28" height="28"></i><div class="nm">map-pin</div></div>
    <div class="cell"><i data-lucide="clock" width="28" height="28"></i><div class="nm">clock</div></div>
    <div class="cell"><i data-lucide="home" width="28" height="28"></i><div class="nm">home</div></div>
    <div class="cell"><i data-lucide="briefcase" width="28" height="28"></i><div class="nm">briefcase</div></div>
    <div class="cell"><i data-lucide="credit-card" width="28" height="28"></i><div class="nm">credit-card</div></div>
    <div class="cell"><i data-lucide="users" width="28" height="28"></i><div class="nm">users</div></div>
    <div class="cell"><i data-lucide="star" width="28" height="28"></i><div class="nm">star</div></div>
    <div class="cell"><i data-lucide="shield" width="28" height="28"></i><div class="nm">shield</div></div>
    <div class="cell"><i data-lucide="phone" width="28" height="28"></i><div class="nm">phone</div></div>
    <div class="cell"><i data-lucide="message-square" width="28" height="28"></i><div class="nm">message</div></div>
    <div class="cell"><i data-lucide="shopping-bag" width="28" height="28"></i><div class="nm">bag</div></div>
    <div class="cell"><i data-lucide="heart" width="28" height="28"></i><div class="nm">heart</div></div>
    <div class="cell"><i data-lucide="settings" width="28" height="28"></i><div class="nm">settings</div></div>
    <div class="cell"><i data-lucide="chevron-right" width="28" height="28"></i><div class="nm">chevron</div></div>
    <div class="cell"><i data-lucide="more-horizontal" width="28" height="28"></i><div class="nm">more</div></div>
  </div>
  <div class="note">Lucide @ 2px stroke, square caps, miter joins. Substitutes for Uber's in-house icons.</div>
  <script>lucide.createIcons();</script>
</body>
</html>
