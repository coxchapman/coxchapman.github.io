<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Badges & Chips</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--mono-0); display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lbl { width: 84px; font: 500 11px var(--font-mono); color: var(--content-tertiary); }
  .chip { font: 500 13px var(--font-text); padding: 6px 12px; border-radius: 9999px; border: 1px solid #E2E2E2; background: #FFF; color: #000; cursor: pointer; }
  .chip.selected { background: #000; color: #FFF; border-color: #000; }
  .badge { font: 700 11px var(--font-text); padding: 3px 8px; border-radius: 4px; letter-spacing: 0.02em; text-transform: uppercase; }
  .badge.pos { background: #E6F2ED; color: #066E3A; }
  .badge.neg { background: #FFEFED; color: #AB1300; }
  .badge.warn { background: #FFF8E7; color: #5C4517; }
  .badge.dark { background: #1F1F1F; color: #FFF; }
  .badge.accent { background: #EFF3FE; color: #1E54B7; }
</style>
</head>
<body>
  <div class="row"><div class="lbl">filter chips</div>
    <div class="chip selected">All</div>
    <div class="chip">Under $15</div>
    <div class="chip">Free delivery</div>
    <div class="chip">★ 4.5+</div>
    <div class="chip">Fast (under 30 min)</div>
    <div class="chip">Pickup</div>
  </div>
  <div class="row"><div class="lbl">badges</div>
    <span class="badge pos">Available</span>
    <span class="badge dark">Promo</span>
    <span class="badge accent">New</span>
    <span class="badge warn">Busy</span>
    <span class="badge neg">Cancelled</span>
  </div>
</body>
</html>
