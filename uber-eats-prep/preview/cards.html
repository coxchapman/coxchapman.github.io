<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--mono-100); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #FFF; border-radius: 12px; padding: 16px; }
  .card.bordered { border: 1px solid #E2E2E2; }
  .card.shadowed { box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .ride { display: flex; align-items: center; gap: 12px; }
  .car-pic { width: 56px; height: 40px; background: #EEEEEE; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .ride-title { font: 700 18px var(--font-text); }
  .ride-meta { font: 400 13px/16px var(--font-text); color: #757575; }
  .ride-price { font: 700 18px var(--font-text); margin-left: auto; }
  .restaurant { display: flex; flex-direction: column; gap: 8px; }
  .photo { height: 80px; background: linear-gradient(135deg,#FFD27A,#E11900); border-radius: 8px; }
  .rest-title { font: 700 16px var(--font-text); }
  .rest-meta { font: 400 13px var(--font-text); color: #757575; }
</style>
</head>
<body>
  <div class="card bordered">
    <div class="ride">
      <div class="car-pic">
        <svg width="48" height="32" viewBox="0 0 64 48" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="miter">
          <path d="M6 32 L10 22 L22 18 L42 18 L54 22 L58 32 Z"/>
          <circle cx="18" cy="34" r="5" fill="#000"/>
          <circle cx="46" cy="34" r="5" fill="#000"/>
          <path d="M22 18 L26 12 L38 12 L42 18"/>
        </svg>
      </div>
      <div>
        <div class="ride-title">UberX</div>
        <div class="ride-meta">3 min away · 4 seats</div>
      </div>
      <div class="ride-price">$12.50</div>
    </div>
  </div>
  <div class="card shadowed">
    <div class="restaurant">
      <div class="photo"></div>
      <div class="rest-title">Tartine Bakery</div>
      <div class="rest-meta">$$ · Bakery · 15–25 min · ★ 4.7</div>
    </div>
  </div>
</body>
</html>
