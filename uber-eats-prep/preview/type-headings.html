<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type — Headings</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--mono-0); display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 14px; }
  .lbl { width: 130px; font: 500 11px var(--font-mono); color: var(--content-tertiary); }
  .spec { font: 400 11px var(--font-mono); color: var(--content-tertiary); margin-left: auto; }
  .h36 { font: 700 36px/40px var(--font-display); letter-spacing: -0.02em; }
  .h28 { font: 700 28px/32px var(--font-display); letter-spacing: -0.015em; }
  .h22 { font: 700 22px/28px var(--font-display); letter-spacing: -0.01em; }
  .h18 { font: 500 18px/24px var(--font-display); }
</style>
</head>
<body>
  <div class="row"><div class="lbl">heading-xxlarge</div><div class="h36">Where to next?</div><div class="spec">36 / 40 / 700</div></div>
  <div class="row"><div class="lbl">heading-xlarge</div><div class="h28">Where to next?</div><div class="spec">28 / 32 / 700</div></div>
  <div class="row"><div class="lbl">heading-large</div><div class="h22">Where to next?</div><div class="spec">22 / 28 / 700</div></div>
  <div class="row"><div class="lbl">heading-medium</div><div class="h18">Where to next?</div><div class="spec">18 / 24 / 500</div></div>
</body>
</html>
