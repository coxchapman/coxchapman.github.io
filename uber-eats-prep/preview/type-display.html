<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type — Display</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--mono-0); display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .lbl { width: 110px; font: 500 11px var(--font-mono); color: var(--content-tertiary); }
  .spec { font: 400 11px var(--font-mono); color: var(--content-tertiary); margin-left: auto; }
  .t96 { font: 800 80px/80px var(--font-display); letter-spacing: -0.04em; }
  .t72 { font: 800 60px/60px var(--font-display); letter-spacing: -0.035em; }
  .t56 { font: 800 44px/44px var(--font-display); letter-spacing: -0.03em; }
</style>
</head>
<body>
  <div class="row"><div class="lbl">display-large</div><div class="t96">Get there</div><div class="spec">96 / 96 / 800</div></div>
  <div class="row"><div class="lbl">display-medium</div><div class="t72">Get there</div><div class="spec">72 / 76 / 800</div></div>
  <div class="row"><div class="lbl">display-small</div><div class="t56">Get there</div><div class="spec">56 / 60 / 800</div></div>
</body>
</html>
