<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry Prep — Meal Planning Variations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx?v=2"></script>
<script type="text/babel" src="design-canvas.jsx?v=2"></script>
<script type="text/babel" src="tweaks-panel.jsx?v=2"></script>
<script type="text/babel" src="shell.jsx?v=2"></script>
<script type="text/babel" src="clinical.jsx?v=2"></script>
<script type="text/babel" src="warm.jsx?v=2"></script>
<script type="text/babel" src="playful.jsx?v=2"></script>
<script type="text/babel" src="hybrid.jsx?v=2"></script>
<script type="text/babel" src="hybrid2.jsx?v=1"></script>
<script type="text/babel" src="launches.jsx?v=1"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "cadence": 5
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const c = t.cadence;

  return (
    <>
      <DesignCanvas>
        <DCSection
          id="brief"
          title="Pantry Prep · packaged meal delivery"
          subtitle="3 directions for adding a Factor/HelloFresh-style meal plan to a delivery app. Each row pairs a new visual sub-brand with a distinct onboarding flow."
        >
          {/* sticky note explaining context */}
          <DCPostIt top={-30} left={840} rotate={-3} width={220}>
            Tweaks panel → change meal cadence (3 / 5 / 7) to see prices and badges update across all 3 landing screens.
          </DCPostIt>
        </DCSection>

        <DCSection
          id="clinical"
          title="A · Method"
          subtitle="Clinical / premium · macro-tracker persona · quiz-led onboarding"
        >
          <DCArtboard id="a1" label="Home — Method tile + banner" width={402} height={874}>
            <MethodHome />
          </DCArtboard>
          <DCArtboard id="a2" label="Promo — engineered to your goals" width={402} height={874}>
            <MethodPromo />
          </DCArtboard>
          <DCArtboard id="a3" label={`Landing — ${c} meals / week`} width={402} height={874}>
            <MethodLanding cadence={c} />
          </DCArtboard>
          <DCArtboard id="a4" label="Launch promo — San Diego, 20% off" width={402} height={874}>
            <MethodLaunch />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="warm"
          title="B · Hearth"
          subtitle="Warm / practical · busy-professional persona · schedule-first onboarding"
        >
          <DCArtboard id="b1" label="Home — Hearth tile + banner" width={402} height={874}>
            <HearthHome />
          </DCArtboard>
          <DCArtboard id="b2" label="Promo — tell us your week" width={402} height={874}>
            <HearthPromo />
          </DCArtboard>
          <DCArtboard id="b3" label={`Landing — ${c} meals / week`} width={402} height={874}>
            <HearthLanding cadence={c} />
          </DCArtboard>
          <DCArtboard id="b4" label="Launch promo — San Diego, 20% off" width={402} height={874}>
            <HearthLaunch />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="playful"
          title="C · Plate"
          subtitle="Playful / energetic · wellness-curious persona · persona-quiz onboarding"
        >
          <DCArtboard id="c1" label="Home — Plate tile + banner" width={402} height={874}>
            <PlateHome />
          </DCArtboard>
          <DCArtboard id="c2" label="Promo — which eater are you?" width={402} height={874}>
            <PlatePromo />
          </DCArtboard>
          <DCArtboard id="c3" label={`Landing — ${c} meals / week`} width={402} height={874}>
            <PlateLanding cadence={c} />
          </DCArtboard>
          <DCArtboard id="c4" label="Launch promo — San Diego, 20% off" width={402} height={874}>
            <PlateLaunch />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="hybrid"
          title="D · Method × Hearth"
          subtitle="Method's brand (slate-green, serif, mono) wearing Hearth's UX (schedule-first onboarding, editorial meal rows)"
        >
          <DCArtboard id="d1" label="Home — Method tile + scheduling banner" width={402} height={874}>
            <HybridHome />
          </DCArtboard>
          <DCArtboard id="d2" label="Promo — tell us your week" width={402} height={874}>
            <HybridPromo />
          </DCArtboard>
          <DCArtboard id="d3" label={`Landing — ${c} meals / week`} width={402} height={874}>
            <HybridLanding cadence={c} />
          </DCArtboard>
          <DCArtboard id="d4" label="Launch promo — San Diego, 20% off" width={402} height={874}>
            <HybridLaunch />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="hybrid2"
          title="E · Plate × Hearth"
          subtitle="Plate's brand (DM Sans, fresh green, yellow) wearing Hearth's UX (schedule-first onboarding, editorial meal rows)"
        >
          <DCArtboard id="e1" label="Home — Plate tile + scheduling banner" width={402} height={874}>
            <Hybrid2Home />
          </DCArtboard>
          <DCArtboard id="e2" label="Promo — tell us your week" width={402} height={874}>
            <Hybrid2Promo />
          </DCArtboard>
          <DCArtboard id="e3" label={`Landing — ${c} meals / week`} width={402} height={874}>
            <Hybrid2Landing cadence={c} />
          </DCArtboard>
          <DCArtboard id="e4" label="Launch promo — San Diego, 20% off" width={402} height={874}>
            <Hybrid2Launch />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Plan">
          <TweakRadio
            label="Meals per week"
            value={t.cadence}
            options={[
              { value: 3, label: '3' },
              { value: 5, label: '5' },
              { value: 7, label: '7' },
            ]}
            onChange={(v) => setTweak('cadence', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
